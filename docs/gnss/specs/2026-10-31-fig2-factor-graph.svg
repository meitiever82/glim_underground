<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <g id="sat">
      <rect x="-6" y="-5" width="12" height="9" fill="#fbe3e0" stroke="#c94f42" stroke-width="1.5"/>
      <rect x="-19" y="-3.5" width="11" height="6" fill="#fbe3e0" stroke="#c94f42" stroke-width="1.5"/>
      <rect x="8" y="-3.5" width="11" height="6" fill="#fbe3e0" stroke="#c94f42" stroke-width="1.5"/>
      <line x1="0" y1="4" x2="0" y2="9" stroke="#c94f42" stroke-width="1.5"/>
      <circle cx="0" cy="10.5" r="1.8" fill="#c94f42"/>
    </g>
  </defs>

  <rect width="1260" height="620" fill="#ffffff"/>
  <text x="630" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">v3 因子图结构：基站双差伪距 + 多普勒 + IMU 预积分 + 激光 between(+可选载波双差)</text>

  <!-- ========== 载波跨时间双差(可选) ========== -->
  <path d="M 592 126 Q 400 180 286 288" fill="none" stroke="#7d5ba6" stroke-width="1.8" stroke-dasharray="6,4"/>
  <path d="M 608 126 Q 800 180 904 288" fill="none" stroke="#7d5ba6" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="588" y="112" width="22" height="22" rx="4" fill="#ece3f5" stroke="#7d5ba6" stroke-width="2"/>
  <text x="599" y="96" text-anchor="middle" font-size="13" fill="#5f4380">载波跨时间双差(可选,消模糊度)</text>

  <!-- ========== GNSS DD 因子(卫星) ========== -->
  <!-- 历元 x1 -->
  <use href="#sat" transform="translate(280,118) rotate(-15)"/>
  <path d="M 280 134 L 280 284" fill="none" stroke="#c94f42" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="292" y="126" font-size="12" fill="#a83a30">DD 伪距+多普勒</text>
  <!-- 历元 x2 -->
  <use href="#sat" transform="translate(450,108) rotate(10)"/>
  <path d="M 450 124 L 450 284" fill="none" stroke="#c94f42" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- 历元 x_{k-1} -->
  <use href="#sat" transform="translate(910,118) rotate(-8)"/>
  <path d="M 910 134 L 910 284" fill="none" stroke="#c94f42" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="922" y="126" font-size="12" fill="#a83a30">每历元×每对星一个因子</text>

  <!-- T_EW 共享说明曲线 -->
  <path d="M 462 120 Q 560 300 610 476" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="470" text-anchor="middle" font-size="12" fill="#777">所有 DD 因子共享 T_EW</text>

  <!-- ========== 激光 between 因子(下方弧线) ========== -->
  <g stroke="#3a7ca5" stroke-width="1.8" fill="none">
    <path d="M 117 333 Q 150 380 186 402"/>
    <path d="M 273 333 Q 240 380 204 402"/>
    <path d="M 287 333 Q 320 380 356 402"/>
    <path d="M 443 333 Q 410 380 374 402"/>
    <path d="M 747 333 Q 780 380 816 402"/>
    <path d="M 903 333 Q 870 380 834 402"/>
    <path d="M 917 333 Q 950 380 986 402"/>
    <path d="M 1073 333 Q 1040 380 1004 402"/>
  </g>
  <g fill="#dceaf7" stroke="#3a7ca5" stroke-width="2">
    <circle cx="195" cy="410" r="9"/>
    <circle cx="365" cy="410" r="9"/>
    <circle cx="825" cy="410" r="9"/>
    <circle cx="995" cy="410" r="9"/>
  </g>
  <text x="365" y="445" text-anchor="middle" font-size="12" fill="#2b5f82">KISS 激光 between</text>

  <!-- ========== IMU 预积分链(主链) ========== -->
  <g stroke="#2a9d8f" stroke-width="2.5">
    <line x1="134" y1="310" x2="186" y2="310"/>
    <line x1="204" y1="310" x2="256" y2="310"/>
    <line x1="304" y1="310" x2="356" y2="310"/>
    <line x1="374" y1="310" x2="426" y2="310"/>
    <line x1="764" y1="310" x2="816" y2="310"/>
    <line x1="834" y1="310" x2="886" y2="310"/>
    <line x1="934" y1="310" x2="986" y2="310"/>
    <line x1="1004" y1="310" x2="1056" y2="310"/>
  </g>
  <line x1="474" y1="310" x2="716" y2="310" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="4,6"/>
  <text x="595" y="318" text-anchor="middle" font-size="26" fill="#333">…</text>
  <g fill="#bfe8dd" stroke="#2a9d8f" stroke-width="2">
    <rect x="186" y="301" width="18" height="18"/>
    <rect x="356" y="301" width="18" height="18"/>
    <rect x="816" y="301" width="18" height="18"/>
    <rect x="986" y="301" width="18" height="18"/>
  </g>
  <text x="195" y="290" text-anchor="middle" font-size="12" fill="#1d7a6f">IMU 预积分</text>

  <!-- ========== 状态节点 ========== -->
  <g fill="#ffffff" stroke="#333" stroke-width="2.5">
    <circle cx="110" cy="310" r="24"/>
    <circle cx="280" cy="310" r="24"/>
    <circle cx="450" cy="310" r="24"/>
    <circle cx="740" cy="310" r="24"/>
    <circle cx="910" cy="310" r="24"/>
    <circle cx="1080" cy="310" r="24"/>
  </g>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="110" y="315">x<tspan baseline-shift="sub" font-size="11">0</tspan></text>
    <text x="280" y="315">x<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <text x="450" y="315">x<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <text x="740" y="315">x<tspan baseline-shift="sub" font-size="11">k-2</tspan></text>
    <text x="910" y="315">x<tspan baseline-shift="sub" font-size="11">k-1</tspan></text>
    <text x="1080" y="315">x<tspan baseline-shift="sub" font-size="11">k</tspan></text>
  </g>

  <!-- ========== T_li 锁死标注 ========== -->
  <rect x="40" y="430" width="180" height="34" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="130" y="452" text-anchor="middle" font-size="12" fill="#666">T_li 锁死(离线标定值)</text>
  <path d="M 130 430 L 112 338" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- ========== T_EW 共享变量 + 先验 ========== -->
  <rect x="485" y="478" width="230" height="44" rx="8" fill="#f5ecd7" stroke="#b8a05a" stroke-width="2"/>
  <text x="600" y="505" text-anchor="middle" font-size="14" fill="#8a7333">T_EW(局部系↔ECEF)在线估计</text>
  <rect x="745" y="492" width="16" height="16" fill="#333"/>
  <line x1="715" y1="500" x2="745" y2="500" stroke="#333" stroke-width="1.5"/>
  <text x="770" y="505" font-size="12" fill="#555">松先验(位置 10m / 旋转 5°)</text>

  <!-- ========== 图例 ========== -->
  <g font-size="13" fill="#333">
    <circle cx="70" cy="578" r="10" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="88" y="583">状态 x_i = (T, V, B) @10Hz</text>

    <rect x="268" y="570" width="14" height="14" fill="#bfe8dd" stroke="#2a9d8f" stroke-width="1.8"/>
    <text x="290" y="583">IMU 预积分因子</text>

    <circle cx="418" cy="578" r="8" fill="#dceaf7" stroke="#3a7ca5" stroke-width="1.8"/>
    <text x="434" y="583">激光 between 因子</text>

    <use href="#sat" transform="translate(600,578) scale(0.9)"/>
    <text x="624" y="583">DD 伪距+多普勒因子</text>

    <rect x="770" y="570" width="14" height="14" rx="3" fill="#ece3f5" stroke="#7d5ba6" stroke-width="1.8"/>
    <text x="792" y="583">载波跨时间 DD(可选)</text>

    <rect x="958" y="570" width="16" height="14" rx="3" fill="#f5ecd7" stroke="#b8a05a" stroke-width="1.8"/>
    <text x="982" y="583">T_EW 共享变量</text>
  </g>
</svg>
